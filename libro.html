<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Aventura Mouse: Capitán Tecnobait</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* [Estilos anteriores se mantienen, se añaden los nuevos para el registro] */
        :root { --primary: #FF6B6B; --secondary: #4ECDC4; --accent: #FFE66D; --dark: #2C3E50; }
        body { font-family: 'Fredoka', sans-serif; background: #0083b0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #game-container { width: 900px; height: 600px; background: linear-gradient(to bottom, #72edf2, #5151e5); border-radius: 25px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 6px solid #fff; }
        .hidden { display: none !important; }
        .input-group { display: flex; flex-direction: column; gap: 15px; width: 300px; }
        input { padding: 15px; border-radius: 15px; border: none; font-size: 1.2rem; text-align: center; }
        button { padding: 15px 30px; border-radius: 50px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-start { background: var(--accent); color: var(--dark); box-shadow: 0 6px 0 #d4b52e; }
        table { width: 80%; background: white; border-radius: 15px; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ccc; text-align: center; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- PANTALLA INICIAL -->
    <div id="screen-start">
        <h1>¡La computadora!</h1>
        <p>¡Ayuda al Capitán Tecnobait!</p>
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Tu nombre">
            <input type="text" id="playerGroup" placeholder="Tu grupo (ej. 1° A)">
            <button class="btn-start" onclick="registrarYComenzar()">¡Comenzar la aventura!</button>
        </div>
    </div>

    <!-- PANTALLA DE JUEGO (Simplificada para el ejemplo) -->
    <div id="screen-game" class="hidden">
        <div id="quiz-area"></div>
    </div>

    <!-- PANTALLA FINAL CON TABLA -->
    <div id="screen-end" class="hidden">
        <h2>¡Felicidades!</h2>
        <table id="leaderboard">
            <thead><tr><th>Nombre</th><th>Grupo</th><th>Tiempo</th></tr></thead>
            <tbody></tbody>
        </table>
        <button onclick="location.reload()">Jugar otra vez</button>
    </div>
</div>

<script>
    let startTime;
    let userData = { name: "", group: "" };

    function registrarYComenzar() {
        userData.name = document.getElementById('playerName').value;
        userData.group = document.getElementById('playerGroup').value;
        
        if(!userData.name || !userData.group) {
            alert("¡Por favor escribe tu nombre y grupo!");
            return;
        }
        
        startTime = Date.now();
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        // Aquí iniciaría la lógica de los ejercicios...
        // Simulamos final tras 5 estrellas:
        setTimeout(terminarJuego, 3000); 
    }

    function terminarJuego() {
        const endTime = ((Date.now() - startTime) / 1000).toFixed(1);
        
        // Guardar en localStorage
        let records = JSON.parse(localStorage.getItem('scores') || '[]');
        records.push({ ...userData, time: endTime });
        records.sort((a, b) => a.time - b.time); // Ordenar por mejor tiempo
        localStorage.setItem('scores', JSON.stringify(records));

        // Mostrar tabla
        document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('screen-end').classList.remove('hidden');
        const tbody = document.querySelector('#leaderboard tbody');
        records.forEach(r => {
            tbody.innerHTML += `<tr><td>${r.name}</td><td>${r.group}</td><td>${r.time}s</td></tr>`;
        });
    }
</script>
</body>
</html>
